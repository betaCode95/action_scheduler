name: action_scheduler_sdk
description: "A cross-platform SDK for scheduling and running local tasks on mobile devices with flexible recurrence rules."
version: 1.0.0

environment:
  sdk: ^3.10.8
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter
  sqflite: ^2.4.1
  flutter_local_notifications: ^18.0.1
  uuid: ^4.5.1
  timezone: ^0.10.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: false
  plugin:
    platforms:
      android:
        package: com.actionscheduler.sdk
        pluginClass: ActionSchedulerPlugin
      ios:
        pluginClass: ActionSchedulerPlugin
